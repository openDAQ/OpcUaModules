name: Build OPC UA module stagings

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: "The commit to stage, in full (empty: the head of the branch dispatched on)"
        default: ""
      opendaq-ref:
        description: "openDAQ commit, branch or tag. If empty, uses the opendaq_ref file from the repo."
        default: ""
  # from another repository's run (the bundle): staged as an artifact of that run, never pushed
  workflow_call:
    inputs:
      ref:
        description: "The commit to stage, in full (empty: the commit this workflow is called at)"
        type: string
        default: ""
      opendaq-ref:
        description: "openDAQ commit, branch or tag. If empty, uses the opendaq_ref file from the repo."
        type: string
        default: ""
      opendaq-artifact:
        description: >-
          The openDAQ staging as an artifact of this run instead of from the registry, {job} for the job, e.g.
          "opendaq-staging-{job}" (empty: pulled from the registry)
        type: string
        default: ""

jobs:
  resolve:
    name: Resolve the commits
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.stagings.outputs.ref }}
      opendaq-ref: ${{ steps.stagings.outputs.opendaq-ref }}
      jobs: ${{ steps.stagings.outputs.jobs }}
      staging-pull: ${{ steps.stagings.outputs.staging-pull }}
      opendaq-artifacts: ${{ steps.stagings.outputs.opendaq-artifacts }}
      repository: ${{ steps.stagings.outputs.repository }}
      staging-push: ${{ steps.stagings.outputs.staging-push }}
    steps:
      # this repository, also when called from another one
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.ref || job.workflow_sha }}

      # the commit staged and the core it is built against; where each lies picks its channel (release/** stable,
      # main dev) and whether the staging is pushed: only a commit on one of them, against a core on one of them, and
      # never from another repository's run
      - name: Request the openDAQ stagings
        id: stagings
        shell: python3 {0}
        env:
          GH_TOKEN: ${{ github.token }}
          OPENDAQ_REF: ${{ inputs.opendaq-ref }}
          OPENDAQ_ARTIFACT: ${{ inputs.opendaq-artifact }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ job.workflow_repository }}
          CALLER: ${{ github.repository }}
        run: |
          import json, os, re, subprocess, sys, urllib.parse

          def gh(*args):
              return subprocess.run(["gh", "api", *args], capture_output=True, text=True, check=True).stdout

          def channel(repository, sha):
              """Where a commit lies: stable on a release/** branch (first), dev on main, else None."""
              branches = [b for b in gh(f"repos/{repository}/branches", "--paginate", "-q", ".[].name").split()
                          if b.startswith("release/")] + ["main"]
              for branch in branches:
                  compare = subprocess.run(["gh", "api", f"repos/{repository}/compare/{urllib.parse.quote(branch, safe='')}...{sha}",
                                            "-q", ".status"], capture_output=True, text=True)
                  if compare.stdout.strip() in ("identical", "behind"):
                      return "stable" if branch.startswith("release/") else "dev"
              return None

          sha = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True, check=True).stdout.strip()

          # the input, or else opendaq_ref; a branch or a tag is resolved to the commit, which is what the core
          # staging is found by and what this staging records
          core = os.environ["OPENDAQ_REF"] or open("opendaq_ref").read().strip()
          if not re.fullmatch(r"[0-9a-f]{40}", core):
              out = subprocess.run(["git", "ls-remote", "https://github.com/openDAQ/openDAQ", core, f"{core}^{{}}"],
                                   capture_output=True, text=True, check=True).stdout
              # the peeled tag (X^{}) sorts last, so a tag gives its commit, not the tag object
              core = sorted(out.splitlines(), key=lambda line: line.split("\t")[1])[-1].split("\t")[0] if out else ""
          if not core:
              sys.exit(f"::error::{os.environ['OPENDAQ_REF'] or 'opendaq_ref'} names no openDAQ commit")

          # the core's staging is looked for in its channel, and in dev when the core lies on neither branch (staged by
          # hand); this staging is pushed only when both lie on one
          core_channel = channel("openDAQ/openDAQ", core)
          own_channel = channel(os.environ["REPOSITORY"], sha)
          push = own_channel is not None and core_channel is not None and os.environ["CALLER"] == os.environ["REPOSITORY"]
          print(f"{os.environ['REPOSITORY']} {sha}: {own_channel or 'on no main or release/**'}; "
                f"core {core}: {core_channel or 'on no main or release/**'}; push: {push}")
          core_channel = core_channel or "dev"

          # job -> the openDAQ staging it builds against, by triplet
          opendaq = {
              "windows-2022-x86_64-msvs-v143-release":       "x86_64-windows-msvc-143-release",
              "windows-2022-x86-msvs-v143-release":          "x86-windows-msvc-143-release",
              "manylinux_2_28-x86_64-ninja-gcc-14-release":  "x86_64-manylinux_2_28-gcc-14-release",
              "manylinux_2_28-armv8-ninja-gcc-14-release":   "armv8-manylinux_2_28-gcc-14-release",
              "ubuntu-22.04-x86_64-ninja-gcc-release":       "x86_64-linux-gcc-11-release",
              "ubuntu-22.04-armv8-ninja-gcc-release":        "armv8-linux-gcc-11-release",
              "macos-26-x86_64-ninja-appleclang-21-release": "x86_64-macos-apple-clang-21-release",
              "macos-26-armv8-ninja-appleclang-21-release":  "armv8-macos-apple-clang-21-release",
          }

          # each openDAQ staging as an artifact of its own, named after this staging, as another layer's stage may
          # share the run: the given artifact of this run, or else pulled from the registry by the resolved commit ...
          if os.environ["OPENDAQ_ARTIFACT"]:
              pull = []
              name = {job: os.environ["OPENDAQ_ARTIFACT"].replace("{job}", job) for job in opendaq}
          else:
              pull = [{"artifact": f"opcua-modules-opendaq-{triplet}", "packages": [{
                          "path": f"ghcr.io/{os.environ['OWNER']}/{core_channel}/staging/opendaq",
                          "annotations": {"org.opencontainers.image.revision": core,
                                          "com.opendaq.package.triplet": triplet}}]}
                      for triplet in opendaq.values()]
              name = {job: f"opcua-modules-opendaq-{triplet}" for job, triplet in opendaq.items()}

          # ... which its job unpacks into staging-deps
          artifacts = [{"match-jobs": [job], "artifacts": [{"name": name[job], "dir": "staging-deps"}]} for job in opendaq]

          staging_push = [{"path": f"ghcr.io/{os.environ['OWNER']}/{own_channel}/staging/opcua-modules",
                           "artifacts": ["opcua-modules-staging-*/opcua"], "tags": ["latest"]}] if push else []

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"repository={os.environ['REPOSITORY']}\n")
              f.write(f"ref={sha}\n")
              f.write(f"opendaq-ref={core}\n")
              f.write(f"jobs={json.dumps(list(opendaq))}\n")
              f.write(f"staging-pull={json.dumps(pull)}\n")
              f.write(f"opendaq-artifacts={json.dumps(artifacts)[1:-1]}\n")   # no brackets: it goes inside packages
              f.write(f"staging-push={json.dumps(staging_push)}\n")

  stage:
    needs: resolve
    name: OpcUaModules
    permissions:
      contents: read
      packages: write
    uses: openDAQ/openDAQ-CI/.github/workflows/stage.yml@bundle/extract-each-artifact-into-its-dir
    with:
      repository: ${{ needs.resolve.outputs.repository }}
      ref: ${{ needs.resolve.outputs.ref }}
      upload-pattern: opcua-modules-*
      timeout: '[{"timeout-minutes": 180}]'
      include-jobs: ${{ needs.resolve.outputs.jobs }}
      staging-pull: ${{ needs.resolve.outputs.staging-pull }}
      packages: '[ ${{ needs.resolve.outputs.opendaq-artifacts }} ]'
      cmake-presets: >-
        [
          {
            "match-jobs": ["*"],
            "configure-preset": "stage",
            "cache-variables":
            {
              "CMAKE_PREFIX_PATH": "${sourceDir}/staging-deps;${sourceDir}/staging-deps/opt/opendaq",
              "CPACK_OPENDAQ_META_FIELDS": "dependencies/opendaq/revision=${{ needs.resolve.outputs.opendaq-ref }}"
            }
          },
          {
            "match-jobs": ["macos-*-x86_64-*"],
            "cache-variables": {"CMAKE_OSX_DEPLOYMENT_TARGET": "10.15"}
          },
          {
            "match-jobs": ["macos-*-armv8-*"],
            "cache-variables": {"CMAKE_OSX_DEPLOYMENT_TARGET": "11.0"}
          }
        ]
      cpack-presets: >-
        [
          {
            "match-jobs": ["*"],
            "stagings": [{"name": "opcua"}]
          }
        ]
      staging-push: ${{ needs.resolve.outputs.staging-push }}
